[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
upload_speed = 921600
monitor_speed = 115200
lib_deps =
  lib_deps =
  adafruit/Adafruit IO Arduino
  knolleary/PubSubClient
  tzapu/WiFiManager
build_flags =
  -D DEBUG_ESP_PORT=Serial


